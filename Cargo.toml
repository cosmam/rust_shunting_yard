[package]
name = "shunting_yard"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lalrpop-util = "0.23.1"
logos = "0.16.1"
logos-display = "0.1.3"
roundable = "0.2.0"
thiserror = "2.0.17"

[build-dependencies]
lalrpop = "0.23.1"

[dev-dependencies]
proptest = "1"
rstest = "0.26.1"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

# Panic-prone Clippy lints are denied in hand-written modules that can tolerate
# them. LALRPOP-generated parser code uses internal unwraps, so a global Clippy
# deny policy would fail on generated code rather than project code.
