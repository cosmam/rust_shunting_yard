name: cargo-mutants

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".cargo/mutants.toml"
      - ".github/workflows/cargo-mutants.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "src/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  shunting-yard-mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Run shunting-yard mutation tests
        run: cargo mutants --in-place

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-out
          path: mutants.out
